name: Build Custom Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
      - name: Build Debug APK
        run: bash dm/android/tools/shell_apk.sh debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-Adreno650-Fix
          path: D2RMobile-android.apk
