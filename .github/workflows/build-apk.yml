name: Build Custom Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK & CMake
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
      - name: Generate Stubs & Build APK
        run: |
          mkdir -p /tmp/gen dm/gfx/nvn
          cp dm_vault_tab.h dm_hud_exp.h dm_touch_native_art.c /tmp/gen/
          echo "0.0f, 0.1f, 0.2f, 0.3f, 0.4f, 0.5f, 0.6f, 0.7f, 0.8f, 0.9f, 1.0f, 1.1f, 1.2f, 1.3f, 1.4f, 1.5f," > /tmp/gen/dm_bright_levels.inc
          echo "fixture" > dm/gfx/nvn/shader_map.tsv
          echo "fixture" > dm/gfx/nvn/pso_manifest.tsv
          echo '#define DMSH_CHAIN "fixture"' > dm/gfx/nvn/dmsh_chain.h
          python3 dm/ios/tools/shell_stubs.py stubs-gen /tmp/gen
          gradle --no-daemon -p dm/android app:assembleDebug -PdmGenDir=/tmp/gen -PdmPython=python3
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-Adreno650-Fix
          path: dm/android/app/build/outputs/apk/debug/app-debug.apk
