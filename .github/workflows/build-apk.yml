name: Build Custom Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK & CMake
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-34"
      - name: Prepare Synthetic Build Fixtures
        run: |
          mkdir -p dm/gfx/nvn ~/dm-work/data/product ~/dm-work/romfs/data ~/dm-work/data/build/cache/dm /tmp/real_gen
          python3 -m venv ~/dm-work/data/build/cache/dm/venv
          tar -xzf headers.tar.gz -C /tmp/real_gen
          find /tmp/real_gen -type f -exec cp {} /tmp/real_gen/ \; 2>/dev/null || true
          cp dm_vault_tab.h dm_hud_exp.h /tmp/real_gen/
          [ -f dm_touch_native_art.c ] && cp dm_touch_native_art.c /tmp/real_gen/ || echo "const unsigned char dm_touch_art[]={0};" > /tmp/real_gen/dm_touch_native_art.c
          sed -i '/gen_/d;/generate\.py/d;/dm_touch_native_art/d;/拷贝真表/d' dm/android/tools/shell_apk.sh
          sed -i 's|def paths(dm, gen):|def paths(dm, gen):\n    import os, shutil, glob; os.makedirs(gen, exist_ok=True); [shutil.copy(f, gen) for f in glob.glob("/tmp/real_gen/*")]|' dm/ios/tools/shell_stubs.py
          echo "fixture" > dm/gfx/nvn/shader_map.tsv
          echo "fixture" > dm/gfx/nvn/pso_manifest.tsv
          echo '#define DMSH_CHAIN "fixture"' > dm/gfx/nvn/dmsh_chain.h
          echo "synthetic" > ~/dm-work/data/product/main.patched.bin
          echo "synthetic" > ~/dm-work/romfs/data/build_manifest.psv
      - name: Build Debug APK
        env:
          DM_ROOT: /home/runner/dm-work/data
          DM_ROMFS_SRC: /home/runner/dm-work/romfs
        run: bash dm/android/tools/shell_apk.sh debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D2RMobile-Adreno650-Fix
          path: D2RMobile-android.apk
